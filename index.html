<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwritten Digit Recognition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b12;
      --ink: #f1f3fb;
      --ink-soft: #9aa1bd;
      --violet: #8b7bff;
      --cyan: #5ee7ff;
      --glass: rgba(255, 255, 255, .06);
      --glass-border: rgba(255, 255, 255, .14);
      --glass-strong: rgba(255, 255, 255, .10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink);
      background: var(--bg);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: .55;
    }

    body::before {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, var(--violet), transparent 70%);
      top: -140px;
      left: -120px;
    }

    body::after {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      bottom: -180px;
      right: -140px;
    }

    .app {
      width: min(920px, 100%);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 44px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(26px, 4vw, 36px);
      margin: 0 0 10px;
      letter-spacing: -.01em;
      background: linear-gradient(135deg, #ffffff, var(--ink-soft) 140%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 0 34px;
      color: var(--ink-soft);
      font-size: 13.5px;
      max-width: 48ch;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: start;
    }

    .canvas-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }

    .canvas-label .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 8px var(--violet);
    }

    .canvas-wrap {
      position: relative;
      max-width: 340px;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
    }

    canvas {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      display: block;
      border: none;
      border-radius: 16px;
      touch-action: none;
      background: #0e0f1a;
      cursor: crosshair;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 22px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
      backdrop-filter: blur(10px);
    }

    #predictBtn {
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      color: #0a0b12;
      border-color: transparent;
      box-shadow: 0 8px 24px -8px rgba(139, 123, 255, .6);
    }

    #predictBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -8px rgba(94, 231, 255, .55);
    }

    #predictBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #clearBtn {
      background: var(--glass-strong);
      color: var(--ink);
    }

    #clearBtn:hover:not(:disabled) {
      background: rgba(255, 255, 255, .14);
      border-color: rgba(255, 255, 255, .25);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    #status {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      color: var(--ink);
      font-size: 12.5px;
      letter-spacing: .02em;
      min-height: 20px;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    #result:empty {
      display: none;
    }

    .digit {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 100px;
      line-height: 1;
      text-align: center;
      margin: 24px 0 8px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 30px rgba(139, 123, 255, .35));
    }

    .row {
      display: grid;
      grid-template-columns: 20px 1fr 58px;
      gap: 12px;
      align-items: center;
      margin: 10px 0;
      font-size: 12.5px;
    }

    .row strong {
      color: var(--ink-soft);
      font-weight: 500;
      text-align: right;
    }

    .bar {
      height: 6px;
      background: rgba(255, 255, 255, .08);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      border-radius: 99px;
      box-shadow: 0 0 10px rgba(94, 231, 255, .4);
      transition: width .5s cubic-bezier(.2, .8, .2, 1);
    }

    .prob {
      text-align: right;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .results-heading {
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 12px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <p class="eyebrow"><span class="dot"></span>Digit Classifier · 0–9</p>
    <h1>Handwritten Digit Recognition</h1>
    <p class="subtitle">Draw one digit in the box below, then press Predict to see the model's read and its confidence
      across every class.</p>

    <div class="grid">
      <section>
        <div class="canvas-label"><span class="dot"></span>Draw here</div>
        <div class="canvas-wrap">
          <canvas id="canvas" width="300" height="300"></canvas>
        </div>
        <div class="buttons">
          <button id="predictBtn">Predict</button>
          <button id="clearBtn">Clear</button>
        </div>
      </section>

      <section>
        <p class="results-heading">Result</p>
        <div id="status">Ready. Draw a digit.</div>
        <div id="result"></div>
      </section>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const predictBtn = document.getElementById("predictBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    let drawing = false;
    let hasDrawn = false;

    function resetCanvas() {
      ctx.fillStyle = "#2c305e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "black";
      hasDrawn = false;
      resultEl.innerHTML = "";
      statusEl.textContent = "Ready. Draw a digit.";
    }

    function point(event) {
      const rect = canvas.getBoundingClientRect();
      const source = event.touches ? event.touches[0] : event;
      return {
        x: (source.clientX - rect.left) * canvas.width / rect.width,
        y: (source.clientY - rect.top) * canvas.height / rect.height
      };
    }

    function start(event) {
      event.preventDefault();
      drawing = true;
      hasDrawn = true;
      const p = point(event);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function move(event) {
      if (!drawing) return;
      event.preventDefault();
      const p = point(event);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function stop(event) {
      if (event) event.preventDefault();
      drawing = false;
      ctx.closePath();
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", stop);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", stop, { passive: false });

    clearBtn.addEventListener("click", resetCanvas);

    predictBtn.addEventListener("click", async () => {
      if (!hasDrawn) {
        statusEl.textContent = "Draw a digit first.";
        return;
      }

      predictBtn.disabled = true;
      statusEl.textContent = "Predicting…";
      resultEl.innerHTML = "";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: canvas.toDataURL("image/png") })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Prediction failed.");

        statusEl.textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}%`;

        const rows = data.probabilities.map((p, digit) => `
      <div class="row">
        <strong>${digit}</strong>
        <div class="bar"><div class="fill" style="width:${p * 100}%"></div></div>
        <span class="prob">${(p * 100).toFixed(1)}%</span>
      </div>
    `).join("");

        resultEl.innerHTML = `<div class="digit">${data.digit}</div>${rows}`;
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        predictBtn.disabled = false;
      }
    });

    resetCanvas();
  </script>
</body>

</html>
